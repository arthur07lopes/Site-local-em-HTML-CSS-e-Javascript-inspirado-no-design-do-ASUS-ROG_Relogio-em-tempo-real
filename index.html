<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <title>ROG Digital Time</title>
    <link rel="stylesheet" href="style.css">
    <script src="relogio.js" defer></script>

</head>
<body>
    <main class="rog-shell">
        <header class="topline">
            <p class="brand">ROG <span>// DIGITAL COMMAND</span></p>
            <p class="live-label">SYSTEM TIME / LOCAL</p>
        </header>

        <section class="clock-panel" aria-labelledby="page-title">
            <p class="eyebrow">LOCAL SYSTEM CLOCK</p>
            <h1 id="page-title">Relógio Digital</h1>
            <time id="clock" class="clock" datetime="">00:00:00</time>
            <p id="current-date" class="current-date">Carregando data...</p>
        </section>

        <figure class="device-panel">
            <div class="device-stage">
                <p class="stage-mark" aria-hidden="true">REPUBLIC OF GAMERS</p>
                <img id="rog-image" class="device-image"
                    src="https://dlcdnwebimgs.asus.com/gain/CD8E933A-10C0-4E13-91D3-AB4A248A19A1"
                    alt="Notebook Asus ROG Zephyrus G16 aberto e visto de frente, com o símbolo ROG na tela e o teclado visível"
                    loading="lazy">
                <p class="stage-fallback" aria-hidden="true" hidden>ROG<br>HARDWARE</p>
            </div>
            <figcaption>
                <a href="https://rog.asus.com/br/laptops/rog-zephyrus/rog-zephyrus-g16-2024/gallery/">
                    IMAGEM: ASUS ROG ZEPHYRUS G16 / GALERIA OFICIAL
                </a>
            </figcaption>
        </figure>

        <footer class="bottomline">
            <span>HORA LOCAL DO DISPOSITIVO</span>
            <span>24H <span aria-hidden="true">/</span> AUTO-UPDATE</span>
        </footer>
</body>
</html>
